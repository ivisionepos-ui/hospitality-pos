name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Set up Node for the till-screen tests
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Online ordering service tests
        run: node --no-warnings --test online/test/online.test.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix tests/ui --no-audit --no-fund
          npx --prefix tests/ui playwright install --with-deps chromium
      - name: Till screen tests (real browser, real hub)
        run: node --test --test-concurrency=1 tests/ui/till.test.cjs
        env:
          DOTNET: dotnet
